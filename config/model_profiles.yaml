# Model profiles & mountable model recommendations for AzomOps-Agent.
#
# Each profile binds a prompt key, fixed runtime policy mode, generation
# parameters, timeouts, context budget, fallback policy, and an ordered list
# of mount slots (subscription-first, surgical OpenRouter, opt-in xAI API).
# Oscar can override mounts/params via /oscar (stored in AZOM_DATA_DIR/model_profiles.override.yaml).

schema_version: 1

recommended_models:
  chatgpt_oauth:
    - id: gpt-6-luna
      tier: fast
      note: "Snabb & billig på abonnemang för triage, klassificering, JSON och verktygsloopar"
    - id: gpt-6.2-sol
      tier: balanced
      note: "Bästa allround-modell på abonnemang för svensk chatt, utkast & produkttext"
    - id: gpt-6.2-astra
      tier: coding
      note: "Djup PHP/WordPress/WooCommerce-kodning & flerfilsdiffar via SIWC"
    - id: gpt-5.2
      tier: balanced
      note: "Nuvarande standardfallback för ChatGPT OAuth"
  xai_grok_build:
    - id: grok-4.7-build-fast
      tier: fast
      note: "Snabb CLI-variant byggd för täta verktygsloopar"
    - id: grok-4.7
      tier: coding
      note: "Flaggskepp för djup kodning & felsökning i WP-arbetsytor"
    - id: grok-4.3
      tier: long_context
      note: "Stor kontext (1M); faller tillbaka till grok-4.7-build-fast om den nekas"
  openrouter:
    - id: anthropic/claude-haiku-5.5
      tier: fast
      note: "Bäst pris/prestanda på OpenRouter ($0.10/$0.50): snabb svenska & strikt JSON"
    - id: anthropic/claude-sonnet-5.5
      tier: quality
      note: "Guldstandard ($2/$10) för svensk kundton & flerfils-PHP/Woo-diffar"
    - id: google/gemini-3.8-flash
      tier: long_context
      note: "1M kontext ($0.75/$3.75): stark på stora HTML/DOM/filträd & analys"
    - id: google/gemini-4-hydrogen
      tier: fast
      note: "Låg TTFT ($1.50/$7.50) för snabb interaktiv chatt"
    - id: google/gemini-4-neon
      tier: quality
      note: "Stark resonering & analys ($3/$15) med 95% cache-rabatt"
    - id: qwen/qwen3-coder-next
      tier: budget
      note: "Billig kodfallback ($0.12/$0.80) för PHP/WP-diffar"
    - id: deepseek/deepseek-v4.1-flash-1017
      tier: budget
      note: "Ultrabillig budgetfallback ($0.15/$0.60)"
  xai_api_key:
    - id: grok-4.1-fast
      tier: fast
      note: "Opt-in betald API-fallback ($0.20/$0.50) för snabb triage & verktyg"
    - id: grok-build-0.1
      tier: coding
      note: "Opt-in betald kodmodell ($1.00/$2.00)"
    - id: grok-4.7
      tier: quality
      note: "Opt-in betald flaggskeppsmodell ($2.00/$6.00)"
    - id: grok-4
      tier: balanced
      note: "Standard xAI API-modell"

profiles:
  cases_classify:
    description: "Strikt JSON-klassificering av inkommande kundmejl (8 kategorier + confidence)"
    workload_class: batch_classify
    prompt_ref: classify
    runtime_policy_mode: none
    untrusted_data_isolation: true
    use_global_route_order: true
    generation:
      max_output_tokens: 512
      temperature: 0.0
      reasoning_effort: low
      stream: false
      response_format:
        type: json_schema
        json_schema:
          name: support_classify_v1
          strict: true
          schema:
            type: object
            additionalProperties: false
            required: ["category", "confidence"]
            properties:
              category:
                type: string
                enum: ["order_status", "shipping", "product", "return", "billing", "technical", "abuse", "other"]
              confidence:
                type: number
                minimum: 0.0
                maximum: 1.0
    timeouts:
      idle_s: 15
      hard_s: 35
      phase_budget_s: 45
    context_budget:
      max_history_turns: 0
      max_history_chars: 0
      max_total_input_chars: 8000
    fallback_policy:
      allow_fallback: true
      on_schema_error: escalate_next_slot
      on_rate_limit: immediate_failover
      on_all_failed: template_fallback
    mounts:
      - slot_id: primary
        route_id: chatgpt_oauth
        model_id: inherit_env
        recommended_model: gpt-6-luna
        tier: fast
        enabled: true
      - slot_id: fallback_or_fast
        route_id: openrouter
        model_id: anthropic/claude-haiku-5.5
        recommended_model: anthropic/claude-haiku-5.5
        tier: fast
        enabled: true
      - slot_id: fallback_or_budget
        route_id: openrouter
        model_id: inherit_env
        recommended_model: deepseek/deepseek-v4.1-flash-1017
        tier: budget
        enabled: true
      - slot_id: fallback_grok_build
        route_id: xai_grok_build
        model_id: grok-4.7-build-fast
        recommended_model: grok-4.7-build-fast
        tier: fast
        enabled: true
      - slot_id: fallback_xai_api
        route_id: xai_api_key
        model_id: inherit_env
        recommended_model: grok-4.1-fast
        tier: fast
        enabled: true

