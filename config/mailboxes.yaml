# Functional mailboxes for case ingest (N configurable).
# Credentials still come from env / secrets.env; each mailbox can override provider.
#
# Example:
# mailboxes:
#   - id: support_se
#     label: Support SE
#     address: support@azom.se
#     site: azom
#     market: se
#     language: sv
#     enabled: true
#     provider: gmail   # optional; default MAIL_PROVIDER
#     # env_prefix: MAIL_SE_  # optional future: MAIL_SE_USERNAME etc.

mailboxes:
  - id: support_default
    label: Support (default)
    address: support@azom.se
    site: azom
    market: se
    language: sv
    enabled: true

  # Enable when NO/DK mail credentials are in secrets.env
  - id: support_no
    label: Support NO
    address: support@azom.no
    site: azom
    market: no
    language: nb
    enabled: false

  - id: support_dk
    label: Support DK
    address: support@azom.dk
    site: azom
    market: dk
    language: da
    enabled: false
