# Functional mailboxes for case ingest (N configurable).
# Credentials come from env / secrets.env; each mailbox can override provider
# and set env_prefix (implemented) so MAIL_<PREFIX>USERNAME etc. resolve.
#
# Enable gate for NO/DK: put working credentials under the mailbox env_prefix
# (or default MAIL_*), then flip enabled: true for that mailbox only — only with
# Oscar written authorization. Do not enable without working IMAP/SMTP or Graph.
#
# Example:
# mailboxes:
#   - id: support_se
#     label: Support SE
#     address: support@azom.se
#     site: azom
#     market: se
#     language: sv
#     enabled: true
#     provider: gmail   # optional; default MAIL_PROVIDER
#     env_prefix: MAIL_SE_  # resolves MAIL_SE_USERNAME, MAIL_SE_PASSWORD, MAIL_SE_FROM, etc.

mailboxes:
  - id: support_default
    label: Support (default)
    address: support@azom.se
    site: azom
    market: se
    language: sv
    enabled: true

  # Oscar + credentials required before enabled: true
  - id: support_no
    label: Support NO
    address: support@azom.no
    site: azom
    market: no
    language: nb
    enabled: false
    env_prefix: MAIL_NO_

  - id: info_no
    label: Info NO
    address: info@azom.no
    site: azom
    market: no
    language: nb
    enabled: false
    env_prefix: MAIL_NO_INFO_

  - id: support_dk
    label: Support DK
    address: support@azom.dk
    site: azom
    market: dk
    language: da
    enabled: false
    env_prefix: MAIL_DK_
