# Live WordPress operations registry for the approved Azom Norway target.
# Secret values do not belong in this file. Each secret_ref is an environment
# variable name (WP_SECRET_*), never WP_USERNAME or WP_APP_PASSWORD.
# SSH-specific host, document root, user, keys, and host-key pins are configured
# separately in the local data directory. No live checks or SSH are enabled here.
sites:
  - id: azom-no
    display_name: Azom Norge (azom.no)
    canonical_url: https://azom.no
    environment: production
    business_owner: Azom
    hosting_provider: unconfigured
    wordpress_version: ""
    php_version: ""
    woocommerce: true
    critical_urls:
      - https://azom.no/
    maintenance_window: "not agreed"
    secret_ref: WP_SECRET_AZOM_NO
    alert_owner: unassigned
    alert_confirmations: 2
    check_interval_seconds: 300
    timeout_seconds: 10
    dedupe_window_seconds: 30
    capabilities:
      hosting_api: unknown
      wp_cli: unknown
      staging: unknown
      backup: unknown
      restore: unknown
      uptime: unknown
      security_scanner: unknown
