- id: dk-shipping-delivery-times
  market: dk
  language: da
  category: shipping
  title: Leveringstid Danmark
  tags: [levering, fragt]
  customer_safe: true
  body: |
    Ordrer i Danmark leveres normalt inden 2–5 hverdage efter afsendelse.
    Du får et trackingnummer, når pakken forlader lageret.
    Hellagdage kan forlænge leveringstiden.

- id: dk-shipping-tracking
  market: dk
  language: da
  category: shipping
  title: Spor din levering
  tags: [tracking, spor]
  customer_safe: true
  body: |
    Når ordren er sendt, får du en e-mail med sporingslink. Kontakt support
    med ordrenummer, hvis du har brug for hjælp til at spore pakken.

- id: dk-shipping-missing-package
  market: dk
  language: da
  category: shipping
  title: Manglende eller forsinket pakke
  tags: [mangler, forsinket, pakke]
  customer_safe: false
  needs_review: true
  body: |
    Hvis leveringstiden er overskredet, og sporingen står stille, hjælper vi dig
    med at undersøge sagen hos transportøren. Hav ordrenummer parat. Vi vender
    tilbage med næste skridt, når undersøgelsen er færdig — vi lover ikke
    erstatning på forhånd.
