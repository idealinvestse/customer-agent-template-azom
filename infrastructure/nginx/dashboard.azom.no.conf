# Azom Ops Agent — Nginx reverse proxy for dashboard.azom.no -> 127.0.0.1:8080
# Requires TLS certificates (e.g. certbot --nginx -d dashboard.azom.no).

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.azom.no;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.azom.no;

    ssl_certificate /etc/letsencrypt/live/dashboard.azom.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.azom.no/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AzomSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    # Block /metrics publicly (scrape 127.0.0.1:8080 directly with Bearer token)
    location ^~ /metrics {
        deny all;
        return 403;
    }

    location /webhooks/messenger {
        proxy_pass http://127.0.0.1:8080/webhooks/messenger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    }
}
